name: ci

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: true
  
jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build-amd64:
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      # ghcr rejects a tag whose repository part has capitals, and
      # github.repository_owner preserves the case of the org. Upstream never
      # trips this because "5stackgg" is already lowercase; a fork whose owner
      # is not (LCrew, say) fails every build-push with "repository name must
      # be lowercase". Per-job because GITHUB_ENV does not cross jobs, and
      # tr rather than ${VAR,,} so the same line is testable off-runner.
      - name: Lowercase the owner for image refs
        run: |
          echo "OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push AMD64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          cache-from: type=registry,ref=ghcr.io/${{ env.OWNER }}/api:buildcache-amd64
          cache-to: type=registry,ref=ghcr.io/${{ env.OWNER }}/api:buildcache-amd64,mode=max
          tags: |
            ghcr.io/${{ env.OWNER }}/api:latest-amd64
            ghcr.io/${{ env.OWNER }}/api:${{ github.sha }}-amd64
  build-arm64:
    needs: tests
    runs-on: ubuntu-24.04-arm
    steps:
      # ghcr rejects a tag whose repository part has capitals, and
      # github.repository_owner preserves the case of the org. Upstream never
      # trips this because "5stackgg" is already lowercase; a fork whose owner
      # is not (LCrew, say) fails every build-push with "repository name must
      # be lowercase". Per-job because GITHUB_ENV does not cross jobs, and
      # tr rather than ${VAR,,} so the same line is testable off-runner.
      - name: Lowercase the owner for image refs
        run: |
          echo "OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          cache-from: type=registry,ref=ghcr.io/${{ env.OWNER }}/api:buildcache-arm64
          cache-to: type=registry,ref=ghcr.io/${{ env.OWNER }}/api:buildcache-arm64,mode=max
          tags: |
            ghcr.io/${{ env.OWNER }}/api:latest-arm64
            ghcr.io/${{ env.OWNER }}/api:${{ github.sha }}-arm64
  merge:
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    steps:
      # ghcr rejects a tag whose repository part has capitals, and
      # github.repository_owner preserves the case of the org. Upstream never
      # trips this because "5stackgg" is already lowercase; a fork whose owner
      # is not (LCrew, say) fails every build-push with "repository name must
      # be lowercase". Per-job because GITHUB_ENV does not cross jobs, and
      # tr rather than ${VAR,,} so the same line is testable off-runner.
      - name: Lowercase the owner for image refs
        run: |
          echo "OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list and push
        run: |
          docker buildx imagetools create -t ghcr.io/${{ env.OWNER }}/api:latest \
            ghcr.io/${{ env.OWNER }}/api:latest-amd64 \
            ghcr.io/${{ env.OWNER }}/api:latest-arm64
          docker buildx imagetools create -t ghcr.io/${{ env.OWNER }}/api:${{ github.sha }} \
            ghcr.io/${{ env.OWNER }}/api:${{ github.sha }}-amd64 \
            ghcr.io/${{ env.OWNER }}/api:${{ github.sha }}-arm64
      - name: Delete Package Versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: api
          package-type: container
          min-versions-to-keep: 9
          ignore-versions: '^buildcache-*'