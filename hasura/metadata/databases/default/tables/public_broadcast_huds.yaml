table:
  name: broadcast_huds
  schema: public
select_permissions:
  # Everyone reads the enabled library. The HUD pickers in the demo player and
  # the stream deck are not administrator-only surfaces, and a row carries
  # nothing sensitive -- a name, a layout id and a thumbnail. storage_key is
  # withheld from every role below administrator so the object key is not a
  # thing anyone but the import flow ever handles.
  - role: guest
    permission:
      columns: &public_columns
        - id
        - slug
        - jthud_id
        - variant
        - name
        - author
        - version
        - description
        - source
        - enabled
        - thumbnail
        - is_signed
        - created_at
        - updated_at
      filter:
        enabled:
          _eq: true
    comment: ""
  - role: user
    permission:
      columns: *public_columns
      filter:
        enabled:
          _eq: true
    comment: ""
  - role: verified_user
    permission:
      columns: *public_columns
      filter:
        enabled:
          _eq: true
    comment: ""
  - role: streamer
    permission:
      columns: *public_columns
      filter:
        enabled:
          _eq: true
    comment: ""
  - role: moderator
    permission:
      columns: *public_columns
      filter:
        enabled:
          _eq: true
    comment: ""
  - role: match_organizer
    permission:
      columns: *public_columns
      filter:
        enabled:
          _eq: true
    comment: ""
  - role: tournament_organizer
    permission:
      columns: *public_columns
      filter:
        enabled:
          _eq: true
    comment: ""
  # Administrators see disabled rows too -- the settings page has to list what
  # it is about to re-enable.
  - role: administrator
    permission:
      columns:
        - id
        - slug
        - jthud_id
        - variant
        - name
        - author
        - version
        - description
        - source
        - enabled
        - storage_key
        - size_bytes
        - thumbnail
        - hud_json
        - is_signed
        - uploaded_by_steam_id
        - created_at
        - updated_at
      filter: {}
    comment: ""
update_permissions:
  # Enable/disable and rename only. Everything that describes the archive
  # (slug, jthud_id, storage_key, hud_json, is_signed) is written once by the
  # import flow from the bytes themselves -- letting it be edited afterwards
  # would let a row stop describing the zip it points at.
  - role: administrator
    permission:
      columns:
        - name
        - description
        - enabled
      filter: {}
      check: {}
    comment: ""
delete_permissions:
  # Builtins have no archive to remove and are what the pod falls back to, so
  # they are disabled rather than deleted. Imported rows are deleted through the
  # api action, which also removes the object -- but the row delete is permitted
  # here so a half-imported row is never stuck.
  - role: administrator
    permission:
      filter:
        source:
          _eq: imported
    comment: ""
